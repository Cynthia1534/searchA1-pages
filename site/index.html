<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A1.art AI 成图创意素材库">
  <title>A1.art · 创意素材库</title>
  <link rel="stylesheet" href="./styles.css?v=935070d1fcb9"><script src="./app.js?v=013e28722028" defer></script>
</head>
<body><div class="shell">
  <header class="topbar"><a class="brand" href="#all">A1.art <span>创意素材库</span></a>
    <nav class="nav" aria-label="素材状态"><a href="#all" data-nav="all">全部素材 <span data-count="all"></span></a><a href="#unprocessed" data-nav="unprocessed">未处理 <span data-count="unprocessed"></span></a><a href="#later" data-nav="later">待采用 <span data-count="later"></span></a><a href="#adopted" data-nav="adopted">已采用 <span data-count="adopted"></span></a><a href="#rejected" data-nav="rejected">不采用 <span data-count="rejected"></span></a></nav>
  </header>
  <main>
    <div class="heading"><div><h1 id="view-title">全部素材</h1><p id="view-description"></p></div><div class="heading-side"><span id="result-count">0 条结果</span><span id="snapshot-time" class="muted"></span></div></div>
    <form id="filters" class="filters" autocomplete="off">
      <input id="search" type="search" placeholder="搜索创意、账号、标签" aria-label="搜索创意、账号和标签">
      <select id="day" aria-label="采集日期"><option value="">全部采集日期</option></select>
      <select id="sort" aria-label="组内排序"><option value="discovered">组内最新采集</option><option value="published">组内最新发布</option><option value="engagement">组内互动表现</option><option value="creative">组内创意评分</option></select>
      <details class="more"><summary>标签与辅助筛选</summary><div class="more-panel"><label>市场地区<select id="market-region"><option value="">全部</option><option value="india">印度</option><option value="indonesia">印尼</option><option value="unknown">待确认</option></select></label><label>平台<select id="platform"><option value="">全部平台</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="facebook">Facebook</option><option value="other">其他网站</option></select></label><label>素材分类<select id="material-kind"><option value="">全部分类</option><option value="ai_image">图片</option><option value="human_ai_dance_video">舞蹈类视频</option><option value="other_ai_video">情景类视频</option></select></label><label>素材来源<select id="discovery-origin"><option value="">全部来源</option><option value="user_provided_profile">提供主页</option><option value="codex_discovery">自主发现</option><option value="muse_discovery">Muse 自主发现</option><option value="unknown">待确认</option></select></label><label>发现 Agent<select id="discovery-agent"><option value="">全部</option><option value="codex">Codex</option><option value="muse">Muse</option><option value="human">人工</option><option value="unknown">待确认</option></select></label><label>受众标签<select id="audience-filter"><option value="">全部受众</option></select></label><label>主题标签<select id="theme-filter"><option value="">全部主题</option></select></label><label>来源账号<select id="source-account"><option value="">全部已收录来源</option></select></label><label>采集日期起<input id="day-from" type="date"></label><label>采集日期止<input id="day-to" type="date"></label><label>核验范围<select id="suitability"><option value="">全部</option><option value="safe">整帖已审核</option><option value="review">仅预览初筛</option></select></label></div></details>
      <button id="reset" type="reset" class="reset">重置</button>
    </form>
    <div id="active-filters" class="active-filters"></div>
    <div class="list-head"><strong id="section-title">全部素材</strong><span id="summary"></span></div>
    <div id="loading" class="empty">正在读取素材数据…</div>
    <div id="error" class="empty" hidden><strong>数据读取失败</strong><span id="error-message"></span><button id="retry" type="button">重试</button></div>
    <div id="empty" class="empty" hidden><strong>没有符合条件的素材</strong><span>可以调整辅助筛选，或点击「重置」。</span></div>
    <section id="cards" class="rows" aria-label="素材列表"></section>
    <nav id="pagination" class="pagination" aria-label="分页" hidden><button id="previous" type="button">上一页</button><span id="page-label"></span><button id="next" type="button">下一页</button></nav>
  </main>
  <footer>公开快照 · 状态、标签、图片描述和备注只保存在当前浏览器，刷新保留，不能跨设备同步。</footer>
</div>
<div id="storage-feedback" class="feedback" role="status" aria-live="polite" hidden></div>
<dialog id="detail"><div class="dialog-shell"><button id="close-detail" type="button" class="close" aria-label="关闭">×</button><div class="detail-media"><div id="detail-visual" class="visual"></div><div id="detail-media-nav" class="media-nav"></div></div><div class="detail-copy"><span id="detail-platform" class="muted"></span><h2 id="detail-title"></h2><p id="detail-meta" class="muted"></p><div id="detail-tags" class="chips"></div><p id="detail-reason"></p><div id="detail-scores"></div><div id="detail-vision" class="visual-note" hidden></div><p id="detail-metrics"></p><label>本机状态<select id="detail-status"></select></label><label>本机备注<textarea id="detail-note" rows="3" placeholder="仅此浏览器保存"></textarea></label><p class="muted">「仅预览初筛」表示只核验了当前图片或封面，未核验整帖；状态和备注不会跨设备同步。</p><a id="detail-link" target="_blank" rel="noopener noreferrer">打开原帖 ↗</a><details><summary>原帖说明与互动历史</summary><p id="detail-caption"></p><div id="detail-history"></div></details></div></div></dialog>
</body></html>
