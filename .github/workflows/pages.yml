name: Publish static gallery

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the public JSON and real previews
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python3 .github/scripts/validate_pages.py
      - name: Package only the public website
        run: |
          mkdir -p _pages/data
          cp site/index.html site/styles.css site/app.js site/.nojekyll _pages/
          cp site/data/materials.json _pages/data/
          cp -R site/assets _pages/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-package
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
