name: Publish static gallery

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the public JSON and real previews
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          root = Path('site')
          data = json.loads((root / 'data' / 'materials.json').read_text())
          assert data['schema_version'] == 2
          taxonomy = data['taxonomy']
          assert set(taxonomy) == {'audience_tags', 'theme_tags'}
          assert len(taxonomy['audience_tags']) == 7 and len(taxonomy['theme_tags']) == 31
          assert isinstance(data['materials'], list)
          for item in data['materials']:
              assert set(item['tags']) == set(taxonomy)
              for field, allowed in taxonomy.items():
                  assert isinstance(item['tags'][field], list)
                  assert set(item['tags'][field]) <= set(allowed)
              assert item['suitability'] in {'safe', 'review'}
              post_url = urlparse(item['post_url'])
              expected_hosts = {
                  'instagram': {'instagram.com', 'www.instagram.com'},
                  'tiktok': {'tiktok.com', 'www.tiktok.com'},
                  'youtube': {'youtube.com', 'www.youtube.com', 'youtu.be'},
                  'facebook': {'facebook.com', 'www.facebook.com'},
                  'threads': {'threads.com', 'www.threads.com', 'threads.net', 'www.threads.net'},
                  'other': {'hailuoai.video', 'www.hailuoai.video'},
              }
              assert post_url.scheme == 'https' and post_url.hostname in expected_hosts.get(item['platform'], set())
              assert post_url.path not in {'', '/'}
              assert item['media']
              for media in item['media']:
                  preview = media.get('preview')
                  if preview:
                      assert preview.startswith('assets/') and '..' not in preview
                      image = root / preview
                      assert image.is_file() and image.stat().st_size > 0
          print(f"Validated {len(data['materials'])} real public records")
          PY
      - name: Package only the public website
        run: |
          mkdir -p _pages/data
          cp site/index.html site/styles.css site/app.js site/.nojekyll _pages/
          cp site/data/materials.json _pages/data/
          cp -R site/assets _pages/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-package
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
